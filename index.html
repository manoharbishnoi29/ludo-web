<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Game</title>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: Arial, sans-serif; padding-top: 50px; }
        .board { width: 300px; height: 300px; background: #3b82f6; margin: 20px auto; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 20px; font-weight: bold; }
        button { background: #22c55e; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Ludo Game</h1>
    <div class="board" id="diceBox">Dice: Click to Roll</div>
    <button onclick="rollDice()">Roll Dice</button>

    <script>
        function rollDice() {
            let rand = Math.floor(Math.random() * 6) + 1;
            document.getElementById("diceBox").innerText = "Dice Value: " + rand;
        }
    </script>
</body>
</html>
